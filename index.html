<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jim.capital</title>
    <link rel="icon" href="favicon.svg?v=twemoji" type="image/svg+xml">
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }
      main {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 48px;
        width: 100%;
      }
      img,
      video {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .frame {
        position: relative;
        flex: 0 1 316px;
        padding: 21px;
        border: 3px solid #8c5d13;
        background: linear-gradient(
          135deg,
          #6b400c 0%,
          #e7bc58 12%,
          #fff0ad 24%,
          #b37c22 40%,
          #efd079 53%,
          #82520e 68%,
          #e7b94d 84%,
          #fff0ad 94%,
          #9b651a 100%
        );
        box-shadow:
          inset 0 0 0 2px #f9df8c,
          inset 0 0 0 5px #94631b,
          inset 0 0 0 7px #eac16a,
          0 8px 24px #4b320b33;
      }
      .frame::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 3px double #795015;
        box-shadow: 0 0 0 1px #ffe8a1, inset 0 0 0 1px #ffe8a1;
        pointer-events: none;
      }
      .frame video {
        position: relative;
        width: 100%;
        box-shadow: 0 0 0 2px #5b390e, 0 0 0 4px #f5d886;
      }
    </style>
    <link rel="stylesheet" href="monitor.css">
    <link rel="stylesheet" href="layout.css">
  </head>
  <body>
    <div class="popout-tools">
      <button id="popout-button" type="button">↗ Pop out</button>
      <span id="popout-status" role="status"></span>
    </div>
    <main>
      <img src="assets/prediction.gif" width="105" height="125" alt="">
      <div class="frame">
        <video autoplay loop muted playsinline width="268" height="414">
          <source src="assets/angel-prayers.mp4" type="video/mp4">
        </video>
      </div>
      <section class="monitor" data-design="1" data-state="pending" aria-label="SPX">
        <div class="cabinet">
          <div class="bezel">
            <div class="screen">
              <div class="screen-meta">
                <span class="symbol">SPX</span>
                <a class="market" href="https://app.hyperliquid.xyz/trade/xyz:SP500">xyz:SP500</a>
              </div>
              <output class="price" id="spx-price">—</output>
              <div class="change" id="spx-change">—</div>
              <div class="ticker" aria-hidden="true">
                <div class="ticker-track">
                  <span data-ticker>SPX · — · SPX · — ·</span>
                  <span data-ticker>SPX · — · SPX · — ·</span>
                </div>
              </div>
              <time class="quote-time" id="spx-time">—</time>
            </div>
          </div>
          <div class="monitor-controls" aria-hidden="true">
            <div class="vents"></div>
            <div class="power"></div>
          </div>
        </div>
      </section>
      <section class="softbank-tracker" data-state="pending" aria-label="SoftBank 9984 estimated price in yen">
        <output id="softbank-price">—</output>
      </section>
    </main>
    <script>
      const design = new URLSearchParams(location.search).get("crt");
      if (["1", "2", "3"].includes(design)) {
        document.querySelector(".monitor").dataset.design = design;
      }
    </script>
    <script src="popout.js" defer></script>
    <script src="ticker.js" defer></script>
    <script src="site.js" type="module"></script>
  </body>
</html>
