<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jim.capital</title>
    <meta property="og:title" content="jim.capital">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jim.capital/">
    <meta property="og:image" content="https://jim.capital/assets/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="jim.capital">
    <meta name="twitter:image" content="https://jim.capital/assets/og.png">
    <link rel="icon" href="favicon.svg?v=twemoji" type="image/svg+xml">
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }
      main {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 48px;
        width: 100%;
      }
      img,
      video {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .frame {
        position: relative;
        flex: 0 1 316px;
        padding: 21px;
        border: 3px solid #8c5d13;
        background: linear-gradient(
          135deg,
          #6b400c 0%,
          #e7bc58 12%,
          #fff0ad 24%,
          #b37c22 40%,
          #efd079 53%,
          #82520e 68%,
          #e7b94d 84%,
          #fff0ad 94%,
          #9b651a 100%
        );
        box-shadow:
          inset 0 0 0 2px #f9df8c,
          inset 0 0 0 5px #94631b,
          inset 0 0 0 7px #eac16a,
          0 8px 24px #4b320b33;
      }
      .frame::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 3px double #795015;
        box-shadow: 0 0 0 1px #ffe8a1, inset 0 0 0 1px #ffe8a1;
        pointer-events: none;
      }
      .frame img {
        position: relative;
        width: 100%;
        box-shadow: 0 0 0 2px #5b390e, 0 0 0 4px #f5d886;
      }
    </style>
    <link rel="stylesheet" href="monitor.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="market-clock.css">
    <link rel="stylesheet" href="price-history.css">
    <link rel="stylesheet" href="softbank-chart.css">
    <link rel="stylesheet" href="airship.css">
  </head>
  <body>
    <main>
      <img src="assets/prediction.gif" width="105" height="125" alt="">
      <div class="frame">
        <img src="assets/angel-prayers.gif" width="268" height="414" alt="" loading="eager">
      </div>
      <section class="monitor doodled-monitor" data-state="pending" data-history="SP500" role="link" tabindex="0" aria-label="S&P 500 · open graphs">
        <output class="doodle-number" id="spx-price">—</output>
      </section>
      <section class="softbank-tracker" aria-label="SoftBank 9984 · past 24 hours, estimated yen price">
        <output id="softbank-price">—</output>
      </section>
      <section class="market-clock" aria-label="San Francisco clock and regular stock market hours">
        <button class="clock-spin" type="button" aria-label="Rotate market clock: drag left or right, or use arrow keys. Home resets the angle." aria-keyshortcuts="ArrowLeft ArrowRight Home">
          <svg class="clock-dial" viewBox="0 0 260 260" role="img" aria-label="24-hour San Francisco market clock" aria-describedby="clock-description">
            <desc id="clock-description">Arcs mark regular U.S. and Japanese stock market sessions in San Francisco time.</desc>
            <circle class="clock-face" cx="130" cy="130" r="119" />
            <g id="clock-sessions"></g>
            <polygon id="clock-marker" class="clock-marker" />
          </svg>
        </button>
      </section>
      <a class="one-word-link" href="https://one-word.jim.capital" aria-label="One Word">
        <img src="assets/one-word-pen-frames.png" width="850" height="85" alt="" draggable="false">
      </a>
      <section class="ai-ticker market-airship" aria-label="Airship market display: Anthropic, OpenAI and Bitcoin">
        <img class="airship-artwork" src="assets/market-airship.png" width="1672" height="941" alt="" draggable="false">
        <div class="airship-display">
          <div class="airship-heading">MARKET SIGNAL</div>
          <a class="ai-quote anth-readout" data-market="ANTHROPIC" href="/graphs?symbol=ANTHROPIC&amp;range=1d" aria-label="Anthropic valuation · open price history">
            <span class="airship-label"><span class="ai-symbol">ANTH</span><span class="airship-unit">VALUATION</span></span><output>—</output>
          </a>
          <a class="ai-quote oa-readout" data-market="OPENAI" href="/graphs?symbol=OPENAI&amp;range=1d" aria-label="OpenAI valuation · open price history">
            <span class="airship-label"><span class="ai-symbol">OA</span><span class="airship-unit">VALUATION</span></span><output>—</output>
          </a>
          <a class="ai-quote btc-readout" data-market="BTC" href="/graphs?symbol=BTC&amp;range=1d" aria-label="Bitcoin price in US dollars · open price history">
            <span class="airship-label"><span class="ai-symbol">BTC</span><span class="airship-unit">USD</span></span><output>—</output>
          </a>
          <div class="airship-status" role="status">CONNECTING</div>
        </div>
      </section>
    </main>
    <script src="ai-ticker.js" type="module"></script>
    <script src="airship.js" type="module"></script>
    <script src="ticker.js" type="module"></script>
    <script src="history-navigation.js" type="module"></script>
    <script src="softbank-chart.js" type="module"></script>
    <script src="market-clock.js" type="module"></script>
    <script src="site.js" type="module"></script>
  </body>
</html>
