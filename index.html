<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jim.capital</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }
      main {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 48px;
        width: 100%;
      }
      img,
      video {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .frame {
        position: relative;
        flex: 0 1 316px;
        padding: 21px;
        border: 3px solid #8c5d13;
        background: linear-gradient(
          135deg,
          #6b400c 0%,
          #e7bc58 12%,
          #fff0ad 24%,
          #b37c22 40%,
          #efd079 53%,
          #82520e 68%,
          #e7b94d 84%,
          #fff0ad 94%,
          #9b651a 100%
        );
        box-shadow:
          inset 0 0 0 2px #f9df8c,
          inset 0 0 0 5px #94631b,
          inset 0 0 0 7px #eac16a,
          0 8px 24px #4b320b33;
      }
      .frame::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 3px double #795015;
        box-shadow: 0 0 0 1px #ffe8a1, inset 0 0 0 1px #ffe8a1;
        pointer-events: none;
      }
      .frame video {
        position: relative;
        width: 100%;
        box-shadow: 0 0 0 2px #5b390e, 0 0 0 4px #f5d886;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/prediction.gif" width="105" height="125" alt="">
      <div class="frame">
        <video autoplay loop muted playsinline width="268" height="414">
          <source src="assets/angel-prayers.mp4" type="video/mp4">
        </video>
      </div>
    </main>
  </body>
</html>
