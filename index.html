<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jim.capital</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }
      main {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 48px;
        width: 100%;
      }
      img,
      video {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .frame {
        position: relative;
        flex: 0 1 316px;
        padding: 21px;
        border: 3px solid #8c5d13;
        background: linear-gradient(
          135deg,
          #6b400c 0%,
          #e7bc58 12%,
          #fff0ad 24%,
          #b37c22 40%,
          #efd079 53%,
          #82520e 68%,
          #e7b94d 84%,
          #fff0ad 94%,
          #9b651a 100%
        );
        box-shadow:
          inset 0 0 0 2px #f9df8c,
          inset 0 0 0 5px #94631b,
          inset 0 0 0 7px #eac16a,
          0 8px 24px #4b320b33;
      }
      .frame::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 3px double #795015;
        box-shadow: 0 0 0 1px #ffe8a1, inset 0 0 0 1px #ffe8a1;
        pointer-events: none;
      }
      .frame video {
        position: relative;
        width: 100%;
        box-shadow: 0 0 0 2px #5b390e, 0 0 0 4px #f5d886;
      }
      .monitor {
        flex: 0 1 380px;
        min-width: 0;
        padding-bottom: 32px;
        position: relative;
      }
      .monitor::before,
      .monitor::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(90deg, #a7a391, #dedacc 45%, #b8b4a3);
      }
      .monitor::before {
        bottom: 9px;
        width: 100px;
        height: 30px;
      }
      .monitor::after {
        bottom: 0;
        width: 190px;
        height: 14px;
        border-radius: 50% 50% 5px 5px;
        box-shadow: 0 5px 8px #0002;
      }
      .cabinet {
        position: relative;
        z-index: 1;
        padding: 24px 22px 16px;
        border: 1px solid #aaa795;
        border-radius: 18px 18px 12px 12px;
        background: linear-gradient(125deg, #eeeadd, #d0ccbb 65%, #bbb7a7);
        box-shadow: inset 2px 3px 2px #fff9, inset -3px -4px 2px #88857066, 7px 12px 22px #0002;
      }
      .bezel {
        padding: 12px;
        border-radius: 48% / 7%;
        background: #777667;
        box-shadow: inset 4px 5px 7px #32332e, 0 2px 1px #fff9;
      }
      .screen {
        position: relative;
        overflow: hidden;
        min-width: 0;
        border-radius: 48% / 7%;
        padding: 22px 16px 18px;
        color: #93ff9b;
        background: radial-gradient(ellipse at center, #143523, #05110c 85%);
        box-shadow: inset 0 0 24px #000;
        font-family: "Courier New", monospace;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 7px #72ff9399;
      }
      .screen::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(0deg, #0002 0 1px, transparent 1px 3px);
        box-shadow: inset 0 0 18px #0008;
      }
      .screen-meta {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      .symbol {
        font-size: 20px;
        letter-spacing: 3px;
      }
      .market {
        color: inherit;
        font-size: 11px;
        text-decoration: none;
      }
      .market:focus-visible {
        outline: 1px solid currentColor;
        outline-offset: 4px;
      }
      .price {
        display: block;
        margin: 27px 0 10px;
        font-size: clamp(26px, 7vw, 42px);
        letter-spacing: -2px;
        line-height: 1;
      }
      .change {
        font-size: 14px;
        min-height: 17px;
      }
      .change[data-direction="down"] {
        color: #ffd085;
      }
      .ticker {
        overflow: hidden;
        margin: 23px -16px 16px;
        padding: 8px 0;
        border-block: 1px solid #93ff9b44;
        font-size: 13px;
        white-space: nowrap;
      }
      .ticker-track {
        display: flex;
        width: max-content;
        animation: ticker-scroll 18s linear infinite;
      }
      .ticker-track span {
        padding-right: 32px;
      }
      .quote-time {
        display: block;
        min-height: 12px;
        text-align: right;
        font-size: 10px;
      }
      .monitor-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 16px 6px 0;
      }
      .vents {
        width: 80px;
        height: 10px;
        background: repeating-linear-gradient(90deg, #777567 0 2px, transparent 2px 5px);
      }
      .power {
        width: 22px;
        height: 13px;
        border: 1px solid #8b8779;
        border-radius: 3px;
        background: #bbb7a5;
        box-shadow: inset 1px 1px 2px #fff9;
        position: relative;
      }
      .power::after {
        content: "";
        position: absolute;
        width: 5px;
        height: 5px;
        top: 3px;
        left: -15px;
        border-radius: 50%;
        background: #b28a32;
      }
      .monitor[data-state="live"] .power::after {
        background: #78d45c;
        box-shadow: 0 0 4px #78d45c;
      }
      @keyframes ticker-scroll {
        to { transform: translateX(-50%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ticker-track { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/prediction.gif" width="105" height="125" alt="">
      <div class="frame">
        <video autoplay loop muted playsinline width="268" height="414">
          <source src="assets/angel-prayers.mp4" type="video/mp4">
        </video>
      </div>
      <section class="monitor" data-state="pending" aria-label="SPX">
        <div class="cabinet">
          <div class="bezel">
            <div class="screen">
              <div class="screen-meta">
                <span class="symbol">SPX</span>
                <a class="market" href="https://app.hyperliquid.xyz/trade/xyz:SP500">xyz:SP500</a>
              </div>
              <output class="price" id="spx-price">—</output>
              <div class="change" id="spx-change">—</div>
              <div class="ticker" aria-hidden="true">
                <div class="ticker-track">
                  <span data-ticker>SPX · — · SPX · — ·</span>
                  <span data-ticker>SPX · — · SPX · — ·</span>
                </div>
              </div>
              <time class="quote-time" id="spx-time">—</time>
            </div>
          </div>
          <div class="monitor-controls" aria-hidden="true">
            <div class="vents"></div>
            <div class="power"></div>
          </div>
        </div>
      </section>
    </main>
    <script src="ticker.js" defer></script>
  </body>
</html>
